services:
  - type: web
    name: jemer-web
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_FORMAT
        value: combined
      - key: BODY_LIMIT
        value: 1mb
      - key: RATE_LIMIT_MAX
        value: 100
      # Set this to your Render app URL or custom domain.
      - key: CORS_ORIGIN
        value: https://jemer-web.onrender.com
      # Configure these in Render with your real database/SMTP values.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_EMAIL
        value: jesusmerci.jemer@gmail.com
      - key: SMTP_TEST
        value: "false"
